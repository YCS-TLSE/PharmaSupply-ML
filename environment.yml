name: pharma-supply
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pandas
  - sqlalchemy
  - psycopg2
  - numpy
  - joblib
  - xgboost
  - scikit-learn
  - shap
  - matplotlib
  - jupyterlab
  - ipywidgets
  - pytest
  - pip
  - pip:
      - fastapi
      - uvicorn
      - pydantic
      - python-dotenv
      - evidently
      - ruff
      - httpx
      - httpx2
      - "psycopg[binary]"
      