[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
# On garde uniquement les erreurs de syntaxe, de bugs potentiels et le tri des imports
select = ["E", "F", "I"]

# Desactivation des regles trop strictes
ignore = [
    "E501", # Lignes longues
]

[tool.pytest.ini_options]
filterwarnings = [
    # Masquer uniquement les warnings venant des dépendances tierces identifiées
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:anyio.*",
]