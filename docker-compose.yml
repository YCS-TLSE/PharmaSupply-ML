# ==============================================================================
# PharmaSupply-ML: Multi-Container MLOps Orchestration
# ==============================================================================
# CONTEXT & PURPOSE:
# Orchestrates the production microservices architecture including:
# - PostgreSQL database initialized with schemas supporting FEFO critical expiry.
# - FastAPI backend serving demand forecasting, replenishment, and alerts.
# - Streamlit dashboard providing the vertical top-to-bottom UI and control center.
# - Shared persistence volumes for ML models (models/), health status (model_status.txt), and reports.
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: pharmasupply-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pharmasupply-api
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: pharmasupply-db
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pharmasupply-db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./models:/app/models # Shared volume for dynamic ML model artifact updates (Train/Serve decoupling)
      - ./model_status.txt:/app/model_status.txt # Synchronization of model drift health status
      - ./reports:/app/reports # Sharing Evidently AI monitoring reports
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: pharmasupply-dashboard
    restart: always
    environment:
      - API_BASE_URL=http://api:8000
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=poll
      - STREAMLIT_SERVER_HEADLESS=true
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
      - ./model_status.txt:/app/model_status.txt # Access to global model alert statuses
    depends_on:
      - api

volumes:
  postgres_data: {}